[project]
name = "myclaw"
version = "0.1.0"
description = "MyClaw project"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "textual",
    "ollama"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
